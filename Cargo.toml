[package]
name = "argus-manager"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "System resource manager service for the Argus on-device LLM inference framework: monitors memory/CPU/GPU/thermal/power and drives adaptive engine policy."
repository = "https://github.com/hedone21/argus-manager"
authors = ["Argus contributors"]
keywords = ["llm", "inference", "resource-manager", "on-device", "policy"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
argus-shared = { git = "https://github.com/hedone21/argus-shared.git", branch = "main" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"], optional = true }
mlua = { version = "0.11", features = ["lua54", "vendored", "send"], optional = true }
evalexpr = "11"
rand = "0.8"
rand_chacha = "0.3"
serde_yaml = "0.9"
thiserror = "1"
validator = { version = "0.20", features = ["derive"] }

[features]
dbus = ["zbus"]
lua = ["mlua"]
default = ["dbus", "lua"]

[dev-dependencies]
insta = { version = "1", features = ["yaml", "json"] }
tempfile = "3"

[[bin]]
name = "mock_manager"
path = "src/bin/mock_manager.rs"

[[bin]]
name = "mock_engine"
path = "src/bin/mock_engine.rs"

[[bin]]
name = "sim_run"
path = "src/bin/sim_run.rs"
required-features = ["lua"]

[[test]]
name = "sim"
path = "tests/sim/main.rs"

# TEMPORARY — must be removed before this branch merges.
#
# The `argus-shared` dependency is pinned to that repo's `main`, which still carries the
# v1 contract; this branch speaks v2. Until argus-shared#2 lands on its main there is no
# published revision to build against, so development resolves the dependency through a
# sibling checkout instead.
#
# The path is relative and CI checks out this repo alone, so every job fails at manifest
# resolution while this stanza is present. That is expected: the branch is a draft and is
# blocked on argus-shared#2 regardless.
#
# To land: merge argus-shared#2, delete this stanza, `cargo update -p argus-shared` to
# repin the lock at the merged revision, and take the PR out of draft.
[patch."https://github.com/hedone21/argus-shared.git"]
argus-shared = { path = "../argus-shared" }
