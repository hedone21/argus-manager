# argus-manager configuration.
#
# The exclusion groups, relief priors, QCF weights and LinUCB parameters that used to live
# here described how to rank ten named actions against each other. The contract carries
# one command now — a KV byte budget — so the ranking, and the per-action tables it read,
# are gone. What is left is the thresholds and the sampling.

[compute]
# gpu_sysfs_path = "/sys/kernel/gpu/gpu_busy_percentage"  # Adreno default; auto-detected when absent.

[adaptation]
# Thermal normalization: temp_safe_c maps to 0.0 pressure, temp_critical_c to 1.0.
temp_safe_c = 35.0
temp_critical_c = 50.0
# Suppress a byte-identical directive for this long. With one command whose payload is a
# quantized budget, consecutive decisions are identical by construction, so this is the
# normal path rather than the exception.
dedup_cooldown_secs = 60.0

[adaptation.trigger]
# Enter/exit hysteresis for the Rust-side trigger flags handed to the Lua script as
# ctx.trigger. The script has its own thresholds for the budget ramp; these gate the
# boolean "this axis is in trouble" the script can read directly.
tbt_enter = 0.30
tbt_exit = 0.10
mem_enter = 0.80
mem_exit = 0.60
temp_enter = 0.70
temp_exit = 0.50
tbt_warmup_tokens = 20
